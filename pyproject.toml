[project]
name = "bit-mutant"
version = "0.1.0"
description = "A pytest plugin that mutation-tests bitwise operators by rewriting function bytecode"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pytest", "mutation testing", "bitwise", "bytecode"]
authors = [
    { name = "jhb123", email = "jhbriggs23@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.entry-points."pytest11"]
bit_mutant = "bit_mutant"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bit-mutant-examples",
    "ruff>=0.16.10",
]

[tool.uv.workspace]
members = ["examples"]

[tool.uv.sources]
bit-mutant-examples = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["test"]
pytester_example_dir = "examples/tests"

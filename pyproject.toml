[project]
name = "bit-mutant"
dynamic = ["version"]
description = "A pytest plugin that mutation-tests bitwise operators by rewriting function bytecode"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pytest", "mutation testing", "bitwise", "bytecode"]
authors = [
    { name = "jhb123", email = "jhbriggs23@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.entry-points."pytest11"]
bit_mutant = "bit_mutant"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

# The version comes from the latest git tag (v1.2.3 -> 1.2.3). Between tags it
# is a dev version like 1.2.4.dev3+gabc1234.
[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

# Ship only the plugin; the examples, tests and tooling stay in the repo.
[tool.hatch.build.targets.sdist]
only-include = ["src/bit_mutant", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "bit-mutant-examples",
    "ruff>=0.16.10",
]

[tool.uv.workspace]
members = ["examples"]

[tool.uv.sources]
bit-mutant-examples = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["test"]
pytester_example_dir = "examples/tests"
